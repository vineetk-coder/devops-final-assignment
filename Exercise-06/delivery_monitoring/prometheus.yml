scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "delivery_service"
    static_configs:
      # Linux/WSL: docker0 host IP. macOS/Windows native Docker: use "host.docker.internal:8000"
